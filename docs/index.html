<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d10">
<title>Promos — toutes les offres au même endroit</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="tete">
  <div class="tete-in">
    <div class="marque"><span class="pastille"></span><b>Promos</b></div>
    <div class="comptes" id="comptes">chargement…</div>
  </div>
  <div class="barre">
    <input id="recherche" type="search" placeholder="Chercher un produit, un marchand…" autocomplete="off">
  </div>
  <div class="outils">
    <select id="tri">
      <option value="remise">Meilleures remises</option>
      <option value="recent">Plus récentes</option>
      <option value="prix">Prix croissant</option>
    </select>
    <div class="vues" id="vues" role="group" aria-label="Mode d'affichage">
      <button class="vue" data-vue="grille" aria-label="Tableau : deux offres côte à côte" title="Tableau — deux offres côte à côte">&#9638;</button>
      <button class="vue" data-vue="liste" aria-label="Liste : une offre par ligne, grand visuel" title="Liste — une offre par ligne">&#9636;</button>
      <button class="vue" data-vue="compacte" aria-label="Compacte : vignette et texte serrés" title="Compacte — beaucoup d'offres à l'écran">&#9776;</button>
    </div>
    <button class="outil" id="eco" aria-pressed="false" title="Économie de données — aucun visuel téléchargé">Éco</button>
    <button class="outil" id="fav" aria-pressed="false" title="Mes favoris">&#9733;<span class="n" id="nFav"></span></button>
  </div>
  <nav class="puces" id="puces"></nav>
</header>

<main>
  <div id="bandeau" class="bandeau"></div>
  <section id="liste" class="grille"></section>
  <p id="vide" class="vide" hidden>Aucune offre ne correspond à ce filtre.</p>
  <p id="plus" class="plus" hidden></p>
</main>

<footer class="pied">
  <p id="mention"></p>
  <p class="fresque" id="fraicheur"></p>
  <p class="note">Les offres sont rassemblées depuis des flux publics (Dealabs, presse spécialisée, Google News). Aucune donnée n'est revendiquée : chaque offre renvoie à sa source, qui fait foi.</p>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
