name: Collecte des promos

# Toutes les heures, en SECOURS. La collecte principale tourne sur le NAS du
# propriétaire (fiable, toutes les 5 minutes) et pousse le site ici ; ce
# workflow ne sert que si le NAS dort. Volontairement espacé : deux collecteurs
# à la même minute se marcheraient dessus pour rien.
#
# Note honnête : GitHub ne garantit pas la minute exacte (les crons planifiés
# peuvent être différés de plusieurs minutes sous charge, et une planification
# sur un dépôt neuf peut mettre un moment avant d'être honorée).
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collecte-promos
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tests
        run: node --test

      - name: Collecter et publier
        run: node collecteur.mjs --publier

      - name: Commiter le site publié
        run: |
          git config user.name  "collecteur-promos"
          git config user.email "collecteur-promos@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Rien de neuf depuis le dernier passage."
          else
            git commit -m "Collecte $(date -u +'%Y-%m-%d %H:%M UTC')"
            # La collecte du NAS pousse ici aussi : on se remet sur ses épaules
            # avant de pousser, sinon l'envoi est refusé.
            git pull -q --rebase --autostash origin main
            git push
          fi
